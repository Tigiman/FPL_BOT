name: FPL deadline reminder

on:
  schedule:
    - cron: "*/15 * * * *"  # GitHub на практике запускает раз в 2–10 ч — это страховка
  workflow_dispatch:        # ручной запуск и перезапуск цепочки перед дедлайном

permissions:
  contents: write           # чтобы закоммитить state.json
  actions: write            # чтобы перезапустить этот workflow

concurrency:
  group: fpl-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 330    # бот может ждать напоминания до 5 ч
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check deadline and send reminder
        id: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Commit state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update reminder state [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Restart before deadline
        if: always() && steps.bot.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run remind.yml --ref "${{ github.ref_name }}"
